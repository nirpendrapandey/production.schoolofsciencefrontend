<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="School Of Science Gallery – Photos from events, labs, and school life." />
  <title>Gallery | School Of Science</title>
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <style>
    .filter-tabs {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding-bottom: var(--space-2);
      scrollbar-width: none;
      margin-bottom: var(--space-5);
    }

    .filter-tabs::-webkit-scrollbar { display: none; }

    .filter-tab {
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      font-size: var(--font-size-xs);
      font-weight: 600;
      white-space: nowrap;
      border: 1.5px solid var(--color-border);
      background: var(--color-white);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .filter-tab.active,
    .filter-tab:active {
      background: var(--color-primary);
      color: var(--color-white);
      border-color: var(--color-primary);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .gallery-item {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:active img {
      transform: scale(1.05);
    }

    .gallery-item-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.6));
      padding: var(--space-2) var(--space-3);
    }

    .gallery-item-title {
      color: white;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .lightbox.hidden { display: none; }

    .lightbox-close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      color: white;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: var(--radius-lg);
      object-fit: contain;
    }

    .lightbox-caption {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: var(--font-size-sm);
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
    }

    /* Placeholder cards */
    .gallery-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: var(--color-accent-light);
      border-radius: var(--radius-lg);
      aspect-ratio: 1;
      border: 1px solid var(--color-accent);
    }

    .gallery-placeholder span {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      margin-top: var(--space-1);
    }
  </style>
</head>
<body>

  <div id="app-header"></div>

  <div class="page-content">
    <!-- Category filters -->
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="All" id="filter-all">All</button>
      <button class="filter-tab" data-filter="Events">Events</button>
      <button class="filter-tab" data-filter="Sports">Sports</button>
      <button class="filter-tab" data-filter="Classroom">Classroom</button>
      <button class="filter-tab" data-filter="Labs">Labs</button>
      <button class="filter-tab" data-filter="Celebrations">Celebrations</button>
      <button class="filter-tab" data-filter="Facilities">Facilities</button>
    </div>

    <div class="gallery-grid" id="gallery-grid">
      <!-- Loaded by JS -->
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox hidden" id="lightbox">
    <div class="lightbox-close" id="lightbox-close">✕</div>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="gallery.js"></script>
  <script>
    Components.renderHeader({ showBack: true, title: 'Gallery' });
    Components.renderBottomNav('home');
  </script>
</body>
</html>
