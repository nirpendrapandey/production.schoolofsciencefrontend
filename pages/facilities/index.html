<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="description" content="School Of Science Facilities – Library, Labs, Smart Classrooms and more." />
  <title>Facilities | School Of Science</title>
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <style>
    .facilities-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-3);
    }

    .facility-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-4);
      text-align: center;
      transition: var(--transition-fast);
    }

    .facility-card:active {
      transform: scale(0.97);
      background: var(--color-accent-light);
    }

    .facility-icon-wrap {
      width: 60px;
      height: 60px;
      background: var(--color-accent-light);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto var(--space-3);
    }

    .facility-name {
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--space-1);
      line-height: 1.3;
    }

    .facility-desc {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="app-header"></div>

  <div class="page-content">
    <div class="section-header">
      <div class="section-title">Our <span>Facilities</span></div>
    </div>

    <div class="facilities-grid" id="facilities-list">
      <!-- Loaded by JS -->
    </div>
  </div>

  <div id="bottom-nav"></div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/components.js"></script>
  <script src="facilities.js?v=2"></script>
  <script>
    Components.renderHeader({ showBack: true, title: 'Facilities' });
    Components.renderBottomNav('home');
  </script>
</body>
</html>
