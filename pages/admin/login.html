<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | School Of Science</title>
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <style>
    body {
      background: var(--color-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
      padding-bottom: var(--space-6);
    }

    .admin-login-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 420px;
      padding: var(--space-10);
      position: relative;
      overflow: hidden;
    }

    .admin-login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--color-primary);
    }

    .admin-logo {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .admin-logo-icon {
      font-size: 56px;
      margin-bottom: var(--space-3);
    }

    .admin-logo h1 {
      font-size: var(--font-size-xl);
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 4px;
    }

    .admin-logo p {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .input-with-icon { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); font-size: 18px; pointer-events: none;
    }
    .input-with-icon .form-control { padding-left: 44px; }
    .password-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); cursor: pointer;
      font-size: 18px; background: none; border: none; padding: 4px;
    }

    .security-note {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-accent-light);
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      margin-top: var(--space-5);
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div class="admin-logo">
      <div class="admin-logo-icon">🏫</div>
      <h1>Admin Panel</h1>
      <p>School Of Science – Administration</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input type="text" id="username" class="form-control"
                 placeholder="Enter admin username" autocomplete="username" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter admin password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="toggle-password">👁️</button>
        </div>
      </div>

      <div id="error-msg" style="color:var(--color-error);font-size:var(--font-size-sm);
           margin-bottom:var(--space-4);display:none;background:var(--color-error-light);
           padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-weight:500;">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
        🔐 Secure Login
      </button>
    </form>

    <div class="security-note">
      🛡️ This page is for authorized administrators only. Unauthorized access is prohibited.
    </div>

    <div style="text-align:center;margin-top:var(--space-5);">
      <a href="../../index.html" style="font-size:var(--font-size-sm);color:var(--color-text-muted);">
        ← Back to School Website
      </a>
    </div>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
