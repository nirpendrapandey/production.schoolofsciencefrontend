<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Students Management | School Of Science</title>
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <style>
    body { padding-bottom: 0; background: var(--color-bg); font-family: var(--font-primary); }
    .admin-topbar { position: sticky; top: 0; z-index: 200; background: var(--color-primary); color: white; height: 60px; display: flex; align-items: center; padding: 0 var(--space-6); gap: var(--space-4); box-shadow: var(--shadow-md); }
    .admin-topbar-logo { font-size: 28px; flex-shrink: 0; }
    .admin-topbar-title { font-size: var(--font-size-lg); font-weight: 800; flex: 1; }
    .admin-topbar-user { display: flex; align-items: center; gap: var(--space-3); }
    .admin-topbar-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--color-accent); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: var(--font-size-sm); }
    .admin-layout { display: flex; min-height: calc(100vh - 60px); }
    .admin-sidebar { width: 240px; background: var(--color-white); border-right: 1px solid var(--color-border); flex-shrink: 0; overflow-y: auto; position: sticky; top: 60px; height: calc(100vh - 60px); }
    .sidebar-section-title { font-size: var(--font-size-xs); font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; padding: var(--space-4) var(--space-5) var(--space-2); }
    .sidebar-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-5); font-size: var(--font-size-sm); font-weight: 500; color: var(--color-text-secondary); cursor: pointer; text-decoration: none; border-left: 3px solid transparent; }
    .sidebar-item:hover { background: var(--color-bg); color: var(--color-primary); }
    .sidebar-item.active { background: rgba(30,58,138,0.06); color: var(--color-primary); font-weight: 700; border-left-color: var(--color-primary); }
    
    .admin-main { flex: 1; padding: var(--space-8); overflow-y: auto; }
    .admin-page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); }
    .admin-page-title { font-size: var(--font-size-2xl); font-weight: 800; color: var(--color-text-primary); }

    /* Advanced Search Bar */
    .advanced-search-bar { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-5); margin-bottom: var(--space-6); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); }
    .search-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-primary); font-size: var(--font-size-sm); }
    .search-input:focus { border-color: var(--color-primary); outline: none; }
    
    .admin-table-wrap { background: var(--color-white); border: 1px solid var(--color-border); border-radius: var(--radius-xl); overflow: hidden; }
    .admin-table { width: 100%; border-collapse: collapse; }
    .admin-table th { background: var(--color-bg); padding: var(--space-3) var(--space-5); text-align: left; font-size: var(--font-size-xs); font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; border-bottom: 1px solid var(--color-border); }
    .admin-table td { padding: var(--space-4) var(--space-5); font-size: var(--font-size-sm); color: var(--color-text-primary); border-bottom: 1px solid var(--color-border-light); }
  </style>
</head>
<body>

<div class="admin-topbar">
  <div class="admin-topbar-logo">🏫</div>
  <div class="admin-topbar-title">School Of Science – Admin Panel</div>
  <div class="admin-topbar-user">
    <div class="admin-topbar-avatar" id="admin-avatar">A</div>
    <a href="../../index.html" class="btn btn-outline" style="color:white;border-color:white;padding:4px 12px;font-size:12px;">Logout</a>
  </div>
</div>

<div class="admin-layout">
  <nav class="admin-sidebar">
    <div class="sidebar-section-title">Overview</div>
    <a href="dashboard.html" class="sidebar-item">📊 Dashboard</a>
    
    <div class="sidebar-section-title">Manage</div>
    <a href="students.html" class="sidebar-item active">🎒 Advanced Search</a>
  </nav>

  <main class="admin-main">
    <div class="admin-page-header">
      <div class="admin-page-title">🔍 Advanced Student Search</div>
    </div>

    <!-- Advanced Search Form -->
    <form class="advanced-search-bar" id="search-form">
      <div>
        <label style="font-size:12px;font-weight:700;color:var(--color-text-muted);display:block;margin-bottom:6px;">Search Query (Name, Adm No, Roll, Phone)</label>
        <input type="text" id="search-q" class="search-input" placeholder="e.g. ADM-123 or Rahul..." required />
      </div>
      <div>
        <label style="font-size:12px;font-weight:700;color:var(--color-text-muted);display:block;margin-bottom:6px;">Filter by Class</label>
        <select id="search-class" class="search-input">
          <option value="">All Classes</option>
          <option value="Nursery">Nursery</option>
          <option value="LKG">LKG</option>
          <option value="UKG">UKG</option>
          <option value="1">Class 1</option><option value="2">Class 2</option>
          <option value="3">Class 3</option><option value="4">Class 4</option>
          <option value="5">Class 5</option><option value="6">Class 6</option>
          <option value="7">Class 7</option><option value="8">Class 8</option>
          <option value="9">Class 9</option><option value="10">Class 10</option>
          <option value="11">Class 11</option><option value="12">Class 12</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;">
        <button type="submit" class="btn btn-primary" style="width:100%;height:41px;">Search Database</button>
      </div>
    </form>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Adm No.</th>
            <th>Name</th>
            <th>Class</th>
            <th>Roll No.</th>
            <th>Phone</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="search-results-table">
          <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--color-text-muted);">Perform a search to see results.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="students.js"></script>
</body>
</html>
