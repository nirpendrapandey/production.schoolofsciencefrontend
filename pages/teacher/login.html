<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Teacher Login | School Of Science</title>
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <style>
    body { background: var(--color-bg); }
    .login-page { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 0; }
    .login-hero {
      background: linear-gradient(135deg, #1a3a2a 0%, #2d6a4a 100%);
      padding: var(--space-10) var(--container-pad) var(--space-12);
      text-align: center;
    }
    .login-hero-icon { font-size: 64px; margin-bottom: var(--space-4); }
    .login-hero h1 { font-size: var(--font-size-2xl); font-weight: 800; color: white; margin-bottom: var(--space-2); }
    .login-hero p { font-size: var(--font-size-sm); color: rgba(255,255,255,0.8); }
    .login-form-card {
      background: var(--color-white);
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      padding: var(--space-8) var(--space-6);
      flex: 1;
      margin-top: -24px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      max-width: var(--max-width-mobile);
      margin-left: auto; margin-right: auto; width: 100%;
    }
    .login-form-card h2 { font-size: var(--font-size-xl); font-weight: 700; margin-bottom: var(--space-6); }
    .input-with-icon { position: relative; }
    .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; }
    .input-with-icon .form-control { padding-left: 44px; }
    .password-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      cursor: pointer; font-size: 18px; background: none; border: none; padding: 4px;
    }
    .login-footer { text-align: center; margin-top: var(--space-5); font-size: var(--font-size-sm); color: var(--color-text-muted); }
    .login-footer a { color: var(--color-primary); font-weight: 600; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-hero">
    <div class="login-hero-icon">👨‍🏫</div>
    <h1>Teacher Login</h1>
    <p>School Of Science – Teacher Portal</p>
  </div>

  <div class="login-form-card">
    <h2>Teacher Portal 📋</h2>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Teacher ID / Username</label>
        <div class="input-with-icon">
          <span class="input-icon">👤</span>
          <input type="text" id="username" class="form-control"
                 placeholder="Enter your teacher ID" autocomplete="username" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-with-icon">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="toggle-password">👁️</button>
        </div>
      </div>

      <div id="error-msg" style="color:var(--color-error);font-size:var(--font-size-sm);
           margin-bottom:var(--space-4);display:none;background:var(--color-error-light);
           padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-weight:500;">
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn"
              style="background:#2d6a4a;">
        Login as Teacher
      </button>
    </form>

    <div class="login-footer">
      <p>Are you a student? <a href="../student/login.html">Student Login →</a></p>
      <p style="margin-top:var(--space-2);"><a href="../../index.html">← Back to Home</a></p>
    </div>
  </div>
</div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
